name: alpha-radar

services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alpha_radar}
      POSTGRES_USER: ${POSTGRES_USER:-alpha_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha_radar_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://alpha_radar:alpha_radar_local@postgres:5432/alpha_radar}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      MARKET_DATA_INGESTION_ENABLED: ${MARKET_DATA_INGESTION_ENABLED:-false}
      MARKET_DATA_QUOTE_FRESHNESS_SECONDS: ${MARKET_DATA_QUOTE_FRESHNESS_SECONDS:-90}
      MARKET_DATA_FUTURE_TOLERANCE_SECONDS: ${MARKET_DATA_FUTURE_TOLERANCE_SECONDS:-30}
      MARKET_DATA_HTTP_TIMEOUT_SECONDS: ${MARKET_DATA_HTTP_TIMEOUT_SECONDS:-10}
      COINBASE_EXCHANGE_API_URL: ${COINBASE_EXCHANGE_API_URL:-https://api.exchange.coinbase.com}
    command: ["sh", "-c", "alembic upgrade head && uvicorn alpha_radar.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://alpha_radar:alpha_radar_local@postgres:5432/alpha_radar}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      MARKET_DATA_INGESTION_ENABLED: ${MARKET_DATA_INGESTION_ENABLED:-false}
      MARKET_DATA_QUOTE_FRESHNESS_SECONDS: ${MARKET_DATA_QUOTE_FRESHNESS_SECONDS:-90}
      MARKET_DATA_FUTURE_TOLERANCE_SECONDS: ${MARKET_DATA_FUTURE_TOLERANCE_SECONDS:-30}
      MARKET_DATA_HTTP_TIMEOUT_SECONDS: ${MARKET_DATA_HTTP_TIMEOUT_SECONDS:-10}
      COINBASE_EXCHANGE_API_URL: ${COINBASE_EXCHANGE_API_URL:-https://api.exchange.coinbase.com}
    command:
      ["celery", "--workdir", "/app/apps/worker", "-A", "main.app", "worker", "--beat", "--loglevel=INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_URL: ${API_URL:-http://api:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
