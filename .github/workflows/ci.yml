name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mac-companion:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift format lint --recursive --strict Package.swift Sources Tests
        working-directory: tools/mac-companion
      - run: swift run --package-path tools/mac-companion ExecutorCoreChecks
      - run: swift build --package-path tools/mac-companion -c release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . ../worker
      - run: ruff format --check . ../worker
      - run: pyright
      - run: pytest

  integration:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Compose stack
        run: docker compose up --build --detach --wait
      - name: Verify health, dependencies, assets, and market data
        run: ./scripts/verify-stack.sh
      - name: Verify bilingual Core 3 product and legacy redirects
        run: python scripts/verify-core-3.py
      - name: Verify bilingual persisted Source Intelligence
        run: python scripts/verify-sources-ui.py
      - name: Verify simulator ledger and bilingual paper UI
        env:
          EVENT_SIGNAL_SHADOW_ENABLED: "true"
          EVENT_SIMULATOR_ENABLED: "true"
          EVENT_SIMULATOR_ADMIN_TOKEN: "disposable-compose-test-operator-token"
        run: |
          docker compose up --no-build --detach --wait --no-deps api web
          docker compose exec -T api python -m alpha_radar.event_simulator.integration_verify
          python scripts/verify-event-simulator.py
      - name: Verify Semi-Auto privacy, defaults, and PostgreSQL lifecycle
        env:
          EVENT_SIGNAL_SHADOW_ENABLED: "true"
          EVENT_SIMULATOR_ENABLED: "true"
          EVENT_SIMULATOR_ADMIN_TOKEN: "disposable-compose-test-operator-token"
          EVENT_SEMI_AUTO_AVAILABLE: "true"
          EVENT_ALERTS_ENABLED: "true"
          EVENT_SEMI_AUTO_OPERATOR_TOKEN: "disposable-compose-semi-auto-test-token"
        run: |
          docker compose up --no-build --detach --wait --no-deps api web
          python scripts/verify-event-semi-auto.py
          docker compose exec -T -e LIVE_EXECUTION_ENABLED=true api python -m alpha_radar.event_semi_auto.integration_verify
      - name: Verify Mac observation through the web proxy
        env:
          EVENT_SIGNAL_SHADOW_ENABLED: "true"
          EVENT_SEMI_AUTO_AVAILABLE: "true"
          MAC_EXECUTOR_OBSERVE_ENABLED: "true"
        run: |
          export MAC_EXECUTOR_CI_TOKEN="$(python -c 'from secrets import token_hex; print(token_hex(32))')"
          export MAC_EXECUTOR_DEVICE_TOKEN_SHA256="$(printf %s "$MAC_EXECUTOR_CI_TOKEN" | sha256sum | cut -d ' ' -f 1)"
          docker compose up --no-build --detach --wait --no-deps api web
          python scripts/verify-mac-executor.py
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes
