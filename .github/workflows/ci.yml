name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . ../worker
      - run: ruff format --check . ../worker
      - run: pyright
      - run: pytest

  integration:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Compose stack
        run: docker compose up --build --detach --wait
      - name: Verify health, dependencies, and PostgreSQL extensions
        run: ./scripts/verify-stack.sh
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes
